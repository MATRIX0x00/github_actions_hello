name: Hourly Hello Bot

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo 🛒
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run hello script
        run: python hello.py

      - name: Commit and push changes 🚀
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add hello_*.txt
          git commit -m "Auto-generated hourly hello" || echo "No changes to commit"
          git push
